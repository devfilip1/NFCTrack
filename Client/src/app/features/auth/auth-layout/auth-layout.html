<aside class="pitch">
  <app-logo />

  <div class="pitch-body">
    <h2>Short links you can edit after sharing.</h2>
    <p>
      Share a short link once and point it somewhere new whenever you need. Every click is counted,
      so you can see which links people actually open.
    </p>

    <figure class="link-demo" aria-hidden="true">
      <div class="demo-window">
        <span class="demo-short">/summer-menu</span>
        <div class="demo-row demo-old">
          <span class="demo-arrow">→</span>
          <span>trattoria.example/menu/spring</span>
        </div>
        <div class="demo-row demo-new">
          <span class="demo-arrow">→</span>
          <span>trattoria.example/menu/summer</span>
        </div>
      </div>
      <figcaption>Same short link, new destination. Nothing to resend.</figcaption>
    </figure>
  </div>

  <small class="pitch-footer">ShortLink · .NET + Angular</small>
</aside>

<main class="panel">
  <div class="form-wrap">
    <app-logo class="mobile-logo" />
    <h1>{{ heading() }}</h1>
    @if (subheading()) {
      <p class="subheading">{{ subheading() }}</p>
    }
    <ng-content />
  </div>
</main>
